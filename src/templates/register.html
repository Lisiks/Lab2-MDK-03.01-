{% extends 'base.html'%}
{% block head %}
    
{% endblock %}

{% block body %}
  <h1>Register</h1>

  
  <form actions="/register" method="POST" class="register-login-form" id="register-form">
    <input type="text" required maxlength="100" minlength="6"  placeholder="Username" name="username">
    <input type="password" required maxlength="72" minlength="6" placeholder="Password" name="password">
    <button type="submit">Register</button>
  </form>
  <a class="reg-log-form-link" href="/login">To login</a>

  <script type="module" src="{{ url_for('static', filename='JS/register_script.js') }}"></script>

{% endblock %}
